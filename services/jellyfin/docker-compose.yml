services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "8096:8096"

    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/e/Media/Movies:/media/movies:ro
      - "/mnt/e/Media/TV Shows:/media/tv:ro"
