services:
  jellyfin:
    image: jellyfin/jellyfin:12.0
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "8096:8096"

    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/graid/Media/Movies:/media/movies:ro
      - "/mnt/graid/Media/TV Shows:/media/tv:ro"
