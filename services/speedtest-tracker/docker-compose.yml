services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      APP_KEY: ${APP_KEY}
      APP_URL: http://100.108.95.74:8083
      ADMIN_EMAIL: admin@homelab.local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CONNECTION: sqlite
      DISPLAY_TIMEZONE: America/Halifax
      SPEEDTEST_SCHEDULE: "15 */4 * * *"
    volumes:
      - speedtest_config:/config

volumes:
  speedtest_config:
